<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="taxiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for iOS style -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Taxi Checkered Top Bar -->
  <g transform="translate(106, 90)">
    <rect x="0" y="0" width="50" height="30" fill="#fbbf24" rx="4" />
    <rect x="50" y="0" width="50" height="30" fill="#27272a" rx="4" />
    <rect x="100" y="0" width="50" height="30" fill="#fbbf24" rx="4" />
    <rect x="150" y="0" width="50" height="30" fill="#27272a" rx="4" />
    <rect x="200" y="0" width="50" height="30" fill="#fbbf24" rx="4" />
    <rect x="250" y="0" width="50" height="30" fill="#27272a" rx="4" />
  </g>

  <!-- Speedometer / Taxi badge -->
  <circle cx="256" cy="270" r="140" fill="#18181b" stroke="url(#taxiGrad)" stroke-width="12" />
  
  <!-- Gauge ticks -->
  <path d="M 160 330 A 110 110 0 1 1 352 330" fill="none" stroke="#3f3f46" stroke-width="8" stroke-dasharray="8 8" />
  <path d="M 160 330 A 110 110 0 0 1 320 180" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" />

  <!-- Ruble Symbol in Center -->
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#ffffff" text-anchor="middle">₽</text>

  <!-- "TAXI" label badge -->
  <rect x="186" y="380" width="140" height="38" rx="19" fill="url(#taxiGrad)" />
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="4">ТАХI</text>
</svg>
